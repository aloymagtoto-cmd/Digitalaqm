<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OG card source — 1200×630</title>
<!--
  Source for assets/img/og-cover.jpg — the image that shows up when the site
  is shared on LinkedIn, WhatsApp, Messenger, Slack, iMessage.

  To regenerate: open this file and screenshot the .card element at exactly
  1200×630, save as assets/img/og-cover.jpg (quality ~85, keep it under
  ~300 KB or WhatsApp will skip the thumbnail).
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #18181b;
    display: grid; place-items: center; min-height: 100vh;
    font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  }

  .card {
    width: 1200px; height: 630px;
    position: relative; overflow: hidden;
    background: #0a0a0b;
    color: #f4f4f5;
    display: grid;
    grid-template-columns: 1fr 362px;
    align-items: center;
    gap: 48px;
    padding: 60px 60px 60px 68px;
  }

  /* same ambient language as the site */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 68px 68px;
    mask-image: radial-gradient(ellipse 75% 70% at 35% 45%, #000 25%, transparent 78%);
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); }
  .orb--violet {
    width: 520px; height: 520px; top: -190px; right: -120px;
    background: radial-gradient(circle, #7c5cff, transparent 68%); opacity: .55;
  }
  .orb--lime {
    width: 460px; height: 460px; bottom: -230px; left: -140px;
    background: radial-gradient(circle, #d6ff3f, transparent 66%); opacity: .30;
  }

  /* one flow, so nothing needs absolute positioning to stay clear */
  .copy {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; gap: 30px;
  }

  .eyebrow {
    display: flex; align-items: center; gap: 12px;
    font-size: 14.5px; font-weight: 500; letter-spacing: .17em;
    text-transform: uppercase; color: rgba(244,244,245,.52);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #d6ff3f; flex: none; }

  h1 {
    font-size: 62px; font-weight: 700; line-height: 1.0; letter-spacing: -.045em;
  }
  .grad {
    background: linear-gradient(100deg, #d6ff3f 0%, #7c5cff 58%, #ff6b4a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .stats {
    display: flex; gap: 40px;
    padding-top: 26px; border-top: 1px solid rgba(255,255,255,.13);
  }
  .stat b {
    display: block; font-size: 31px; font-weight: 700; letter-spacing: -.035em;
    line-height: 1; margin-bottom: 6px; white-space: nowrap;
  }
  .stat span {
    font-size: 13.5px; color: rgba(244,244,245,.45);
    letter-spacing: .01em; white-space: nowrap;
  }

  .domain {
    font-size: 17px; font-weight: 600; letter-spacing: -.01em; color: #d6ff3f;
  }

  /* Brand mark panel — the card carries the practice, not a face. */
  .mark {
    position: relative; z-index: 1;
    width: 362px; height: 470px;
    border-radius: 24px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.16);
    background: linear-gradient(150deg, #7c5cff, #150c37 70%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
  }
  .mark::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 28%, rgba(214,255,63,.20), transparent 62%);
  }
  .mark b {
    position: relative; z-index: 1;
    font-size: 96px; font-weight: 700; letter-spacing: -.05em; line-height: 1;
  }
  .mark span {
    position: relative; z-index: 1;
    font-size: 14px; font-weight: 500; letter-spacing: .19em;
    text-transform: uppercase; color: rgba(244,244,245,.62);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="orb orb--violet"></div>
    <div class="orb orb--lime"></div>

    <div class="copy">
      <p class="eyebrow">
        <span class="dot"></span> AQM Digital Marketing · 9+ years
      </p>

      <h1>Media buying that<br />moves <span class="grad">the number.</span></h1>

      <div class="stats">
        <div class="stat"><b>$117K+</b><span>Google Ads managed</span></div>
        <div class="stat"><b>9.08×</b><span>Peak ROAS</span></div>
        <div class="stat"><b>2,400+</b><span>Leads driven</span></div>
      </div>

      <p class="domain">digitalaqm.com</p>
    </div>

    <div class="mark">
      <b>AQM</b>
      <span>Digital Marketing</span>
    </div>
  </div>
</body>
</html>
